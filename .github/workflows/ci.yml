name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Prepare Nuxt
        run: |
          cd apps/admin && npx nuxt prepare
          cd ../web && npx nuxt prepare

      - name: Lint
        run: npm run lint

      - name: Test web
        run: npm run test:web -- --run

      - name: Test admin
        run: npm run test:admin -- --run
