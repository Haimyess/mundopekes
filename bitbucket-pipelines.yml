image: node:22

definitions:
  caches:
    npm: ~/.npm
    node-modules-root: node_modules
    node-modules-web: apps/web/node_modules
    node-modules-admin: apps/admin/node_modules
    node-catalog-agent: scripts/catalog-agent/node_modules
  steps:
    - step: &install
        name: Install dependencies
        caches:
          - npm
          - node-modules-root
          - node-modules-web
          - node-modules-admin
        script:
          - npm ci --legacy-peer-deps
        artifacts:
          - node_modules/**
          - apps/web/node_modules/**
          - apps/admin/node_modules/**

    - step: &prepare
        name: Prepare Nuxt
        script:
          - cd apps/admin && npx nuxt prepare
          - cd ../web && npx nuxt prepare
        artifacts:
          - apps/admin/.nuxt/**
          - apps/web/.nuxt/**

    - step: &lint
        name: Lint
        script:
          - npm run lint

    - step: &test-web
        name: Test Web
        script:
          - npm run test:web -- --run

    - step: &security
        name: Security scan
        script:
          - npx snyk test --all-projects --severity-threshold=critical
        after-script:
          - echo "Security scan complete"

    - step: &deploy-web-preview
        name: Deploy Web Preview
        script:
          - export VERCEL_ORG_ID=$VERCEL_ORG_ID
          - export VERCEL_PROJECT_ID=$VERCEL_PROJECT_ID_WEB
          - npx vercel --token=$VERCEL_TOKEN --yes

    - step: &deploy-admin-preview
        name: Deploy Admin Preview
        script:
          - export VERCEL_ORG_ID=$VERCEL_ORG_ID
          - export VERCEL_PROJECT_ID=$VERCEL_PROJECT_ID_ADMIN
          - npx vercel --token=$VERCEL_TOKEN --yes

    - step: &deploy-web-prod
        name: Deploy Web Production
        script:
          - export VERCEL_ORG_ID=$VERCEL_ORG_ID
          - export VERCEL_PROJECT_ID=$VERCEL_PROJECT_ID_WEB
          - npx vercel --prod --token=$VERCEL_TOKEN --yes

    - step: &deploy-admin-prod
        name: Deploy Admin Production
        script:
          - export VERCEL_ORG_ID=$VERCEL_ORG_ID
          - export VERCEL_PROJECT_ID=$VERCEL_PROJECT_ID_ADMIN
          - npx vercel --prod --token=$VERCEL_TOKEN --yes

pipelines:
  branches:
    main:
      - step: *install
      - step: *prepare
      - step: *lint
      - step: *test-web
      - step:
          <<: *security
          trigger: manual
      - parallel:
          - step: *deploy-web-prod
          - step: *deploy-admin-prod

    dev:
      - step: *install
      - step: *prepare
      - step: *lint
      - step: *test-web
      - parallel:
          - step: *deploy-web-preview
          - step: *deploy-admin-preview

  pull-requests:
    '**':
      - step: *install
      - step: *prepare
      - step: *lint
      - step: *test-web

  custom:
    catalog-agent-weekly:
      - step:
          name: 'Catalog Agent — Weekly Discovery'
          image: node:22
          caches:
            - node-catalog-agent
          script:
            - echo "Starting MundoPekes Catalog Agent"
            - cd scripts/catalog-agent
            - npm ci
            - npm start
          after-script:
            - |
              if [ $BITBUCKET_EXIT_CODE -ne 0 ]; then
                echo "Pipeline failed with exit code $BITBUCKET_EXIT_CODE"
              fi

    qa-e2e-weekly:
      - step:
          name: 'QA E2E Agent — Weekly Review'
          image: node:22
          caches:
            - npm
            - node-modules-root
            - node-modules-web
            - node-modules-admin
          script:
            - npm ci --legacy-peer-deps
            - cd apps/admin && npx nuxt prepare && cd ../web && npx nuxt prepare && cd ../..
            - npm run lint
            - npm run test:web -- --run
            - npm run test:admin -- --run
            - npm install -g @anthropic-ai/claude-code
            - >
              claude -p "You are the qa-e2e agent. Read and follow
              .claude/agents/qa-e2e.md exactly, using .ai/project/architecture.md
              for the list of critical flows. Lint and the unit test suites
              (web + admin) already ran in this pipeline before you started —
              read their output above and treat any failures as findings, do
              not re-run them. Follow the 'Notes specific to MundoPekes'
              section for what to do given no browser tool is available.
              Write your summary to qa-e2e-report.md at the repo root."
              --dangerously-skip-permissions
          artifacts:
            - qa-e2e-report.md
          after-script:
            - |
              if [ $BITBUCKET_EXIT_CODE -ne 0 ]; then
                echo "Pipeline failed with exit code $BITBUCKET_EXIT_CODE"
              fi
